apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:18-alpine
        ports:
        - containerPort: 5435
        envFrom:
        - configMapRef:
            name: db-config
        - secretRef:
            name: db-secret
        env:
        - name: POSTGRES_DB
          valueFrom: { configMapKeyRef: { name: db-config, key: DB_NAME } }
        - name: POSTGRES_USER
          valueFrom: { configMapKeyRef: { name: db-config, key: DB_USER } }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: db-secret, key: DB_PASSWORD } }
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"